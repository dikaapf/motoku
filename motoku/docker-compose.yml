services:
  motoku:
    build: .
    ports:
      - "5000:5000"
    environment:
      MOTOKU_SECRET_KEY: ${MOTOKU_SECRET_KEY:-change-me-in-production}
      MOTOKU_HOST: 0.0.0.0
      MOTOKU_PORT: "5000"
      MOTOKU_DEBUG: "0"
      MOTOKU_AUTH_USER: ${MOTOKU_AUTH_USER:-}
      MOTOKU_AUTH_PASSWORD: ${MOTOKU_AUTH_PASSWORD:-}
      MOTOKU_DB_PATH: /app/data/motoku.db
      MOTOKU_CSRF_ENABLED: "1"
      MOTOKU_RATE_LIMIT_ENABLED: "1"
      MOTOKU_REDIS_URL: redis://redis:6379/0
      MOTOKU_JOB_BACKEND: rq
      MOTOKU_HIBP_API_KEY: ${MOTOKU_HIBP_API_KEY:-}
      MOTOKU_URLSCAN_API_KEY: ${MOTOKU_URLSCAN_API_KEY:-}
      MOTOKU_OTX_API_KEY: ${MOTOKU_OTX_API_KEY:-}
      MOTOKU_CERTSPOTTER_API_KEY: ${MOTOKU_CERTSPOTTER_API_KEY:-}
      MOTOKU_SHODAN_API_KEY: ${MOTOKU_SHODAN_API_KEY:-}
      MOTOKU_CENSYS_API_ID: ${MOTOKU_CENSYS_API_ID:-}
      MOTOKU_CENSYS_API_SECRET: ${MOTOKU_CENSYS_API_SECRET:-}
      MOTOKU_FOFA_API_KEY: ${MOTOKU_FOFA_API_KEY:-}
      MOTOKU_NETLAS_API_KEY: ${MOTOKU_NETLAS_API_KEY:-}
      MOTOKU_VT_API_KEY: ${MOTOKU_VT_API_KEY:-}
      MOTOKU_ABUSEIPDB_API_KEY: ${MOTOKU_ABUSEIPDB_API_KEY:-}
      MOTOKU_GREYNOISE_API_KEY: ${MOTOKU_GREYNOISE_API_KEY:-}
      MOTOKU_IPINFO_TOKEN: ${MOTOKU_IPINFO_TOKEN:-}
      MOTOKU_ABUSECH_API_KEY: ${MOTOKU_ABUSECH_API_KEY:-}
      MOTOKU_PHISHTANK_API_KEY: ${MOTOKU_PHISHTANK_API_KEY:-}
      MOTOKU_GSB_API_KEY: ${MOTOKU_GSB_API_KEY:-}
      MOTOKU_NVD_API_KEY: ${MOTOKU_NVD_API_KEY:-}
      MOTOKU_GITHUB_TOKEN: ${MOTOKU_GITHUB_TOKEN:-}
      MOTOKU_FIRMS_MAP_KEY: ${MOTOKU_FIRMS_MAP_KEY:-}
      MOTOKU_OPENCORPORATES_TOKEN: ${MOTOKU_OPENCORPORATES_TOKEN:-}
      MOTOKU_REDDIT_CLIENT_ID: ${MOTOKU_REDDIT_CLIENT_ID:-}
      MOTOKU_REDDIT_CLIENT_SECRET: ${MOTOKU_REDDIT_CLIENT_SECRET:-}
      MOTOKU_ALERT_WEBHOOK: ${MOTOKU_ALERT_WEBHOOK:-}
      MOTOKU_ALERT_EMAIL: ${MOTOKU_ALERT_EMAIL:-}
      MOTOKU_SMTP_HOST: ${MOTOKU_SMTP_HOST:-}
      MOTOKU_SMTP_PORT: ${MOTOKU_SMTP_PORT:-}
      MOTOKU_SMTP_USER: ${MOTOKU_SMTP_USER:-}
      MOTOKU_SMTP_PASSWORD: ${MOTOKU_SMTP_PASSWORD:-}
      MOTOKU_SMTP_FROM: ${MOTOKU_SMTP_FROM:-}
    depends_on:
      - redis
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  # Background worker for recon / subdomain / port scan jobs (RQ).
  worker:
    build: .
    command: ["rq", "worker", "--url", "redis://redis:6379/0", "motoku"]
    environment:
      MOTOKU_DB_PATH: /app/data/motoku.db
      MOTOKU_REDIS_URL: redis://redis:6379/0
      MOTOKU_HIBP_API_KEY: ${MOTOKU_HIBP_API_KEY:-}
      MOTOKU_URLSCAN_API_KEY: ${MOTOKU_URLSCAN_API_KEY:-}
      MOTOKU_OTX_API_KEY: ${MOTOKU_OTX_API_KEY:-}
      MOTOKU_CERTSPOTTER_API_KEY: ${MOTOKU_CERTSPOTTER_API_KEY:-}
      MOTOKU_SHODAN_API_KEY: ${MOTOKU_SHODAN_API_KEY:-}
      MOTOKU_CENSYS_API_ID: ${MOTOKU_CENSYS_API_ID:-}
      MOTOKU_CENSYS_API_SECRET: ${MOTOKU_CENSYS_API_SECRET:-}
      MOTOKU_FOFA_API_KEY: ${MOTOKU_FOFA_API_KEY:-}
      MOTOKU_NETLAS_API_KEY: ${MOTOKU_NETLAS_API_KEY:-}
      MOTOKU_VT_API_KEY: ${MOTOKU_VT_API_KEY:-}
      MOTOKU_ABUSEIPDB_API_KEY: ${MOTOKU_ABUSEIPDB_API_KEY:-}
      MOTOKU_GREYNOISE_API_KEY: ${MOTOKU_GREYNOISE_API_KEY:-}
      MOTOKU_IPINFO_TOKEN: ${MOTOKU_IPINFO_TOKEN:-}
      MOTOKU_ABUSECH_API_KEY: ${MOTOKU_ABUSECH_API_KEY:-}
      MOTOKU_PHISHTANK_API_KEY: ${MOTOKU_PHISHTANK_API_KEY:-}
      MOTOKU_GSB_API_KEY: ${MOTOKU_GSB_API_KEY:-}
      MOTOKU_NVD_API_KEY: ${MOTOKU_NVD_API_KEY:-}
      MOTOKU_GITHUB_TOKEN: ${MOTOKU_GITHUB_TOKEN:-}
      MOTOKU_FIRMS_MAP_KEY: ${MOTOKU_FIRMS_MAP_KEY:-}
      MOTOKU_OPENCORPORATES_TOKEN: ${MOTOKU_OPENCORPORATES_TOKEN:-}
      MOTOKU_REDDIT_CLIENT_ID: ${MOTOKU_REDDIT_CLIENT_ID:-}
      MOTOKU_REDDIT_CLIENT_SECRET: ${MOTOKU_REDDIT_CLIENT_SECRET:-}
      MOTOKU_ALERT_WEBHOOK: ${MOTOKU_ALERT_WEBHOOK:-}
      MOTOKU_ALERT_EMAIL: ${MOTOKU_ALERT_EMAIL:-}
      MOTOKU_SMTP_HOST: ${MOTOKU_SMTP_HOST:-}
      MOTOKU_SMTP_PORT: ${MOTOKU_SMTP_PORT:-}
      MOTOKU_SMTP_USER: ${MOTOKU_SMTP_USER:-}
      MOTOKU_SMTP_PASSWORD: ${MOTOKU_SMTP_PASSWORD:-}
      MOTOKU_SMTP_FROM: ${MOTOKU_SMTP_FROM:-}
    depends_on:
      - redis
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  redis-data:
